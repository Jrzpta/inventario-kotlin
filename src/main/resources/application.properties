spring.application.name=inventario

# ---------- Base de datos MySQL ----------
# 1) Ejecuta antes database/inventario_mysql.sql en MySQL Workbench.
# 2) Cambia usuario y clave por los de tu MySQL.
# (Para probar sin MySQL usa el perfil "h2": ver application-h2.properties)
spring.datasource.url=jdbc:mysql://localhost:3306/inventario_envases?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Umbral de bajo stock para productos nuevos que no indican uno
inventario.stock-minimo-por-defecto=5

# Usuario administrador inicial (se crea solo si no existe)
inventario.admin.usuario=admin
inventario.admin.clave=admin123
