# Perfil "h2": base de datos en memoria, SIN necesidad de MySQL.
# Los datos se pierden al cerrar la aplicación. Útil para probar rápido.
#
# Cómo activarlo:
#   IntelliJ: Run > Edit Configurations > Active profiles = h2
#   Maven:    ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

